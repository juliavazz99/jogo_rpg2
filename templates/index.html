<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>BACKROOMS - O ÚLTIMO CORREDOR</title>

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.2/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2026.7.2/core.js">
    </script>


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        :root {
            --amarelo: #d4c52a;
            --amarelo-escuro: #8e8518;
            --preto: #080806;
            --painel: rgba(12, 12, 9, 0.94);
            --texto: #eeeecc;
            --cinza: #aaa990;
            --vermelho: #d92828;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            min-height: 100dvh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--texto);

            background:
                linear-gradient(
                    rgba(0,0,0,.45),
                    rgba(0,0,0,.75)
                ),
                repeating-linear-gradient(
                    90deg,
                    #a89e27 0px,
                    #b7ad31 35px,
                    #92891e 70px,
                    #aaa025 105px
                );

            position: relative;
        }


        /* =====================================================
           EFEITO DE PAREDE DAS BACKROOMS
           ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.025) 0px,
                    rgba(255,255,255,.025) 2px,
                    rgba(0,0,0,.025) 3px,
                    rgba(0,0,0,.025) 5px
                );

            opacity: .7;
            z-index: 1;
        }


        /* =====================================================
           LUZ FLUORESCENTE
           ===================================================== */

        body::after {
            content: "";

            position: fixed;

            top: 0;
            left: 10%;
            right: 10%;

            height: 22px;

            background: rgba(255,255,210,.75);

            box-shadow:
                0 0 20px rgba(255,255,200,.9),
                0 0 60px rgba(255,255,180,.45);

            opacity: .7;

            pointer-events: none;

            z-index: 2;
        }


        button {
            font: inherit;
        }


        /* =====================================================
           TELA INICIAL
           ===================================================== */

        #tela-inicio {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            overflow: hidden;

            background:

                linear-gradient(
                    rgba(0,0,0,.58),
                    rgba(0,0,0,.88)
                ),

                repeating-linear-gradient(
                    90deg,
                    #9e951f 0px,
                    #b1a62c 45px,
                    #8b8219 90px,
                    #aaa027 135px
                );
        }


        /* corredor falso ao fundo */

        #tela-inicio::before {

            content: "";

            position: absolute;

            width: 65vw;
            height: 85vh;

            left: 50%;
            top: 55%;

            transform:
                translate(-50%, -50%)
                perspective(500px)
                rotateX(8deg);

            background:

                linear-gradient(
                    90deg,
                    rgba(0,0,0,.75),
                    transparent 18%,
                    transparent 82%,
                    rgba(0,0,0,.75)
                );

            box-shadow:
                inset 0 0 120px rgba(0,0,0,.85);

            opacity: .9;
        }


        .painel-inicio {

            position: relative;

            z-index: 5;

            width: min(780px, 95%);

            padding:
                clamp(30px, 6vw, 65px);

            text-align: center;

            border:
                1px solid rgba(255,255,180,.22);

            background:
                rgba(5,5,3,.82);

            box-shadow:
                0 0 80px rgba(0,0,0,.85),
                inset 0 0 50px rgba(0,0,0,.5);

            backdrop-filter: blur(3px);
        }


        /* remove completamente a capa antiga */

        #capa-jogo {
            display: none !important;
        }


        /* remove o emoji */

        #icone-abertura {
            display: none !important;
        }


        #titulo-abertura {

            margin: 0 0 18px;

            color: #eeeecf;

            font-size:
                clamp(35px, 7vw, 72px);

            line-height: 1;

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(255,255,200,.3),
                0 4px 20px #000;
        }


        #subtitulo-abertura {

            margin: 0 0 12px;

            color: #aaa98b;

            font-size:
                clamp(15px, 3vw, 21px);

            letter-spacing: 2px;
        }


        #autor-abertura {

            margin: 0 0 35px;

            color: #777760;

            font-size: 14px;
        }


        #botao-iniciar {

            width: min(400px, 100%);

            padding: 17px 25px;

            border:
                1px solid #c9bd36;

            border-radius: 3px;

            background:
                linear-gradient(
                    180deg,
                    #81791d,
                    #565113
                );

            color: #eeeecc;

            font-size: 19px;

            font-weight: bold;

            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:
                0 0 25px rgba(0,0,0,.7);

            transition:
                .2s;
        }


        #botao-iniciar:hover:not(:disabled) {

            background:
                linear-gradient(
                    180deg,
                    #aaa12c,
                    #71691a
                );

            box-shadow:
                0 0 30px rgba(220,210,70,.2);

            transform: scale(1.02);
        }


        #botao-iniciar:disabled {

            opacity: .5;

            cursor: progress;
        }


        .dica-inicio {

            margin-top: 20px;

            color: #666651;

            font-size: 12px;
        }


        /* =====================================================
           JOGO PRINCIPAL
           ===================================================== */

        .container {

            position: relative;

            z-index: 5;

            width: 100%;
            height: 100dvh;

            max-width: 1600px;

            margin: auto;

            padding:
                clamp(10px, 1.5vw, 18px);

            display: grid;

            gap:
                clamp(10px, 1.5vw, 18px);

            overflow: hidden;
        }


        /* =====================================================
           CABEÇALHO
           ===================================================== */

        .cabecalho {

            min-width: 0;
            min-height: 0;

            text-align: center;
        }


        #titulo-jogo {

            margin: 0 0 4px;

            color: #eeeecc;

            font-size:
                clamp(20px, 3vw, 40px);

            letter-spacing: 3px;

            text-shadow:
                0 3px 12px #000;
        }


        #autor-jogo {

            margin: 0;

            color: #aaa98a;

            font-size:
                clamp(11px, 1.4vw, 15px);
        }


        /* =====================================================
           ÁREA DE IMAGEM
           ===================================================== */

        .midia {

            min-width: 0;
            min-height: 0;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            padding: 10px;

            border:
                1px solid rgba(255,255,180,.16);

            background:
                rgba(5,5,3,.82);

            box-shadow:
                0 15px 45px rgba(0,0,0,.65);
        }


        .media-frame {

            position: relative;

            min-height: 0;

            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border:
                1px solid rgba(255,255,180,.1);

            background:

                linear-gradient(
                    rgba(0,0,0,.22),
                    rgba(0,0,0,.55)
                ),

                repeating-linear-gradient(
                    90deg,
                    #9e941f 0px,
                    #b0a42a 45px,
                    #898019 90px,
                    #a79b24 135px
                );

            box-shadow:
                inset 0 0 100px rgba(0,0,0,.85);
        }


        /* teto */

        .media-frame::before {

            content: "";

            position: absolute;

            top: 7%;

            left: 12%;
            right: 12%;

            height: 12px;

            background: #eeeecb;

            box-shadow:
                0 0 15px #ffffcc,
                0 0 45px rgba(255,255,180,.7);

            opacity: .8;

            z-index: 1;
        }


        /* corredor no centro */

        .media-frame::after {

            content: "";

            position: absolute;

            width: 48%;
            height: 75%;

            left: 26%;
            top: 20%;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.65),
                    rgba(0,0,0,.05) 25%,
                    rgba(0,0,0,.05) 75%,
                    rgba(0,0,0,.65)
                );

            box-shadow:
                inset 0 0 70px rgba(0,0,0,.7);

            opacity: .8;
        }


        #imagem-cena,
        #video-cena {

            position: relative;

            z-index: 3;

            width: 100%;
            height: 100%;

            min-height: 0;

            object-fit: contain;

            background: transparent;
        }


        #imagem-cena {
            display: none;
        }


        #video-cena {
            display: none;
        }


        /* =====================================================
           ÁUDIO - ESCONDIDO
           ===================================================== */

        .controles-midia {
            display: none !important;
        }


        /* =====================================================
           PAINEL DO JOGO
           ===================================================== */

        .painel-jogo {

            min-width: 0;
            min-height: 0;

            display: grid;

            grid-template-rows:
                auto
                minmax(0, 1fr)
                auto
                auto;

            gap: 10px;

            overflow: hidden;

            padding:
                clamp(12px, 1.5vw, 18px);

            border:
                1px solid rgba(255,255,180,.15);

            background:
                rgba(8,8,6,.94);

            box-shadow:
                0 15px 45px rgba(0,0,0,.65);
        }


        #titulo-cena {

            margin: 0;

            color: #d9ce58;

            font-size:
                clamp(20px, 2.4vw, 30px);

            letter-spacing: 1px;

            text-shadow:
                0 2px 10px #000;
        }


        #texto-cena {

            min-height: 0;

            overflow: auto;

            white-space: pre-line;

            padding: 18px;

            border-left:
                3px solid #a89d2b;

            border-radius: 3px;

            background:
                rgba(35,34,20,.72);

            color: #eeeece;

            font-size:
                clamp(15px, 1.4vw, 18px);

            line-height: 1.65;

            box-shadow:
                inset 0 0 30px rgba(0,0,0,.35);
        }


        /* barra de rolagem */

        #texto-cena::-webkit-scrollbar {

            width: 8px;
        }


        #texto-cena::-webkit-scrollbar-track {

            background: #11110c;
        }


        #texto-cena::-webkit-scrollbar-thumb {

            background: #77701d;

            border-radius: 5px;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 8px;
        }


        .status-box {

            min-width: 0;

            padding:
                9px 11px;

            border:
                1px solid rgba(255,255,180,.13);

            background:
                rgba(35,34,20,.72);

            border-radius: 3px;
        }


        .status-label {

            display: block;

            margin-bottom: 3px;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #8f8d6e;
        }


        .status-value {

            overflow: hidden;

            text-overflow: ellipsis;

            color: #eeeecc;

            font-size:
                clamp(12px, 1.3vw, 16px);
        }


        #vida.danger {

            color: #ff5555;
        }


        /* =====================================================
           BOTÕES
           ===================================================== */

        #opcoes {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 8px;
        }


        .botao-opcao,
        #reiniciar {

            min-width: 0;

            padding:
                12px;

            border:
                1px solid rgba(210,200,70,.25);

            border-radius: 3px;

            color: #eeeecc;

            background:
                linear-gradient(
                    180deg,
                    #302f1b,
                    #1e1e12
                );

            cursor: pointer;

            transition:
                .15s;
        }


        .botao-opcao:hover:not(:disabled),
        #reiniciar:hover {

            background:
                linear-gradient(
                    180deg,
                    #514d20,
                    #302e14
                );

            border-color:
                rgba(230,220,90,.5);

            transform:
                translateY(-1px);
        }


        .botao-opcao:disabled {

            opacity: .25;

            cursor: not-allowed;
        }


        #reiniciar {

            width: 100%;

            color: #aaa98b;

            background:
                #16160e;
        }


        /* =====================================================
           MODO PAISAGEM
           ===================================================== */

        @media (orientation: landscape) {

            .container {

                grid-template-columns:
                    minmax(0,1fr)
                    minmax(0,1fr);

                grid-template-rows:
                    auto
                    minmax(0,1fr);

                grid-template-areas:

                    "cabecalho cabecalho"
                    "midia painel";
            }


            .cabecalho {
                grid-area: cabecalho;
            }


            .midia {
                grid-area: midia;
            }


            .painel-jogo {
                grid-area: painel;
            }
        }


        /* =====================================================
           MODO RETRATO
           ===================================================== */

        @media (orientation: portrait) {

            .container {

                grid-template-columns:
                    minmax(0,1fr);

                grid-template-rows:
                    auto
                    minmax(0,40fr)
                    minmax(0,60fr);

                grid-template-areas:

                    "cabecalho"
                    "midia"
                    "painel";
            }


            .cabecalho {
                grid-area: cabecalho;
            }


            .midia {
                grid-area: midia;
            }


            .painel-jogo {
                grid-area: painel;
            }
        }


        /* =====================================================
           TELAS PEQUENAS
           ===================================================== */

        @media (orientation: portrait) and (max-height: 760px) {

            .container {

                padding: 5px;

                gap: 5px;

                grid-template-rows:
                    auto
                    minmax(0,34fr)
                    minmax(0,66fr);
            }


            #titulo-jogo {

                font-size:
                    clamp(16px,4.6vw,24px);
            }


            .painel-jogo {

                gap: 6px;
            }


            .botao-opcao,
            #reiniciar {

                padding: 8px 9px;

                font-size: 13px;
            }
        }


    </style>

</head>


<body>


    <!-- =====================================================
         TELA INICIAL
         ===================================================== -->

    <div id="tela-inicio">

        <div class="painel-inicio">

            <!-- Mantido para o Python do framework -->
            <img
                id="capa-jogo"
                src=""
                alt=""
            >

            <!-- Mantido, mas escondido pelo CSS -->
            <div
                id="icone-abertura"
                class="icone-jogo">
                🎮
            </div>


            <h1 id="titulo-abertura">
                BACKROOMS
            </h1>


            <p id="subtitulo-abertura">
                O ÚLTIMO CORREDOR
            </p>


            <p id="autor-abertura">
                Uma aventura onde você não deveria estar.
            </p>


            <button
                id="botao-iniciar"
                type="button"
                disabled>
                CARREGANDO...
            </button>


            <div class="dica-inicio">
                NÃO OLHE PARA TRÁS.
            </div>

        </div>

    </div>



    <!-- =====================================================
         JOGO
         ===================================================== -->

    <main class="container">


        <header class="cabecalho">

            <h1 id="titulo-jogo">
                BACKROOMS - O ÚLTIMO CORREDOR
            </h1>


            <p id="autor-jogo">
                Julia
            </p>

        </header>



        <!-- =================================================
             ÁREA VISUAL
             ================================================= -->

        <section class="midia">

            <div class="media-frame">

                <img
                    id="imagem-cena"
                    src=""
                    alt="Imagem da cena atual"
                >


                <video
                    id="video-cena"
                    controls
                    playsinline
                    preload="metadata">
                    Seu navegador não suporta vídeo.
                </video>

            </div>


            <!-- áudio continua existindo escondido
                 para não quebrar o framework -->

            <div class="controles-midia">

                <audio
                    id="audio-fundo"
                    controls
                    loop
                    preload="metadata">
                </audio>

                <div class="controle-audio">
                    Trilha sonora
                </div>

            </div>

        </section>



        <!-- =================================================
             PAINEL NARRATIVO
             ================================================= -->

        <section class="painel-jogo">


            <h2 id="titulo-cena">
                Cena
            </h2>


            <div id="texto-cena">
                Carregando...
            </div>


            <!-- STATUS -->

            <section id="status">


                <div class="status-box">

                    <span class="status-label">
                        Vida
                    </span>

                    <div
                        id="vida"
                        class="status-value">
                        ❤️ ❤️ ❤️
                    </div>

                </div>


                <div class="status-box">

                    <span class="status-label">
                        Inventário
                    </span>

                    <div
                        id="inventario"
                        class="status-value">
                        Vazio
                    </div>

                </div>


                <div class="status-box">

                    <span class="status-label">
                        Pontos
                    </span>

                    <div
                        id="pontos"
                        class="status-value">
                        0
                    </div>

                </div>


            </section>



            <!-- OPÇÕES -->

            <div id="opcoes">

                <button
                    id="opcao1"
                    class="botao-opcao"
                    type="button">
                </button>


                <button
                    id="opcao2"
                    class="botao-opcao"
                    type="button">
                </button>


                <button
                    id="opcao3"
                    class="botao-opcao"
                    type="button">
                </button>


                <button
                    id="opcao4"
                    class="botao-opcao"
                    type="button">
                </button>

            </div>



            <button
                id="reiniciar"
                type="button">

                ↻ REINICIAR AVENTURA

            </button>


        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* ==============================================
           ÁUDIO
           Mantido para compatibilidade com o framework,
           mas não aparece na tela.
           ============================================== */

        window.frameworkAudio = {

            started: false,


            async play(src, volume = 0.5, loop = true) {

                const audio =
                    document.getElementById(
                        "audio-fundo"
                    );


                if (!src) {
                    return;
                }


                if (
                    audio.getAttribute("src")
                    !== src
                ) {

                    audio.src = src;

                    audio.load();
                }


                audio.volume = volume;

                audio.loop = loop;


                try {

                    await audio.play();

                    this.started = true;

                }

                catch (erro) {

                    console.log(
                        "Áudio bloqueado pelo navegador."
                    );
                }

            },


            stop() {

                const audio =
                    document.getElementById(
                        "audio-fundo"
                    );


                audio.pause();

                audio.currentTime = 0;

            }

        };



        /* ==============================================
           VÍDEO
           ============================================== */

        window.frameworkVideo = {

            async play(
                src,
                autoplay = false
            ) {

                const video =
                    document.getElementById(
                        "video-cena"
                    );


                const imagem =
                    document.getElementById(
                        "imagem-cena"
                    );


                imagem.style.display =
                    "none";


                video.src = src;

                video.style.display =
                    "block";

                video.load();


                if (autoplay) {

                    try {

                        await video.play();

                    }

                    catch (erro) {

                        console.log(
                            "Vídeo disponível para reprodução manual."
                        );

                    }

                }

            },


            stop() {

                const video =
                    document.getElementById(
                        "video-cena"
                    );


                video.pause();

                video.style.display =
                    "none";

                video.removeAttribute(
                    "src"
                );

                video.load();

            }

        };



        /* ==============================================
           BOTÃO INICIAR
           ============================================== */

        const botaoIniciar =
            document.getElementById(
                "botao-iniciar"
            );


        const telaInicio =
            document.getElementById(
                "tela-inicio"
            );


        botaoIniciar.addEventListener(
            "click",
            async function () {

                /*
                 * Não iniciamos áudio.
                 * O jogo simplesmente começa.
                 */

                telaInicio.style.display =
                    "none";

            }
        );



        /* ==============================================
           ERRO DE IMAGEM
           ============================================== */

        document
            .getElementById("imagem-cena")
            .addEventListener(
                "error",
                function () {

                    this.style.display =
                        "none";

                }
            );


    </script>



    <!-- =====================================================
         PYTHON DO JOGO
         ===================================================== -->

    <script
        type="py"
        src="./main.py">
    </script>


</body>

</html>
